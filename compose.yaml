services:
  gateway:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      INFERMESH_API_KEY: ${INFERMESH_API_KEY:?Set INFERMESH_API_KEY in .env}
      INFERMESH_CONFIG: /app/config/demo.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    mem_limit: 512m

